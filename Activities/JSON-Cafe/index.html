<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweetPour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f7f4;
      color: #2a1e18;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .price {
      color: #a8671a;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container py-5" style="max-width: 760px;">

    <header class="mb-5">
      <h1 class="brand display-3 mb-1">SweetPour</h1>
      <p class="text-secondary fs-5 mb-0">Coffee, poured slowly.</p>
    </header>

    <div class="row" id="parent"></div>

  </div>

  <script>
    var menu = [
      {
        name: "Spanish Latte",
        category: "Espresso",
        price: 145,
        description: "Espresso with sweetened milk, smooth and rich.",
        sizes: ["12oz", "16oz"],
        isBestSeller: true
      },
      {
        name: "Honey Cold Brew",
        category: "Cold brew",
        price: 135,
        description: "Steeped for 18 hours, finished with a drizzle of honey.",
        sizes: ["16oz"],
        isBestSeller: true
      },
      {
        name: "Caramel Macchiato",
        category: "Espresso",
        price: 160,
        description: "Vanilla milk, espresso on top, caramel to finish.",
        sizes: ["12oz", "16oz"],
        isBestSeller: false
      },
      {
        name: "Flat White",
        category: "Espresso",
        price: 130,
        description: "Double shot with velvety steamed milk.",
        sizes: ["8oz"],
        isBestSeller: false
      },
      {
        name: "Kapeng Barako",
        category: "Brewed",
        price: 90,
        description: "Strong local barako, served black or with milk.",
        sizes: ["12oz"],
        isBestSeller: false
      },
      {
        name: "Matcha Latte",
        category: "Non-coffee",
        price: 150,
        description: "Ceremonial matcha whisked with milk.",
        sizes: ["12oz", "16oz"],
        isBestSeller: false
      }
    ];

    var elParent = document.getElementById("parent");

    for (var i = 0; i < menu.length; i++) {
      var badge = "";

      if (menu[i].isBestSeller) {
        badge = `<span class="badge text-bg-warning ms-2 fs-6 fw-normal">Best seller</span>`;
      }

      elParent.innerHTML += `
        <div class="col-12 col-md-6">
          <div class="card border-0 p-4 my-3 shadow-sm rounded-4 h-100">
            <div class="h4 mb-1">` + menu[i].name + badge + `</div>
            <div class="text-secondary small mb-3">` + menu[i].category + `</div>
            <div class="mb-3">` + menu[i].description + `</div>
            <div class="d-flex justify-content-between align-items-baseline mt-auto">
              <span class="text-secondary small">` + menu[i].sizes.join(", ") + `</span>
              <span class="price fs-5">₱` + menu[i].price + `</span>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweetPour</title>
  
  <!-- Tab Favicon/Logo -->
  <link rel="icon" type="image/png" href="images/target.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --header-bg: #3b2a20;     /* header background color */
      --header-text: #f8f7f4;   /* header text color */
      --page-bg: #f8f7f4;       /* page background */
      --text: #2a1e18;          /* main text */
      --price: #a8671a;         /* price color */
      --image-bg: #e9dfd2;      /* shows behind a picture while loading */
    }

    body {
      background: var(--page-bg);
      color: var(--text);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Header */
    .site-header {
      background: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 3rem 1rem;
    }

    .site-header h1 {
      font-size: 2.75rem;
      letter-spacing: 0.02em;
      margin-bottom: 0.25rem;
    }

    .site-header p {
      margin: 0;
      opacity: 0.8;
    }

    /* Section titles */
    .category-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      margin: 3rem 0 1.5rem;
    }

    /* Cards */
    .menu-card {
      overflow: hidden;
    }

    .menu-image {
      aspect-ratio: 4 / 3;
      background: var(--image-bg);
    }

    .menu-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .price {
      color: var(--price);
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <h1 class="brand">SweetPour</h1>
    <p>Coffee, poured slowly.</p>
  </header>

  <div class="container pb-5" style="max-width: 900px;" id="parent"></div>

  <script>
    var menu = [
      {
        name: "Spanish Latte",
        category: "Coffee",
        price: 145,
        description: "Espresso with sweetened milk, smooth and rich.",
        sizes: ["12oz", "16oz"],
        image: "images/spanish.jpg"
      },
      {
        name: "Honey Cold Brew",
        category: "Coffee",
        price: 135,
        description: "Steeped for 18 hours, finished with a drizzle of honey.",
        sizes: ["16oz"],
        image: "images/honey-cold-brew.jpg"
      },
      {
        name: "Caramel Macchiato",
        category: "Coffee",
        price: 160,
        description: "Vanilla milk, espresso on top, caramel to finish.",
        sizes: ["12oz", "16oz"],
        image: "images/caramel-macchiato.jpg"
      },
      {
        name: "Flat White",
        category: "Coffee",
        price: 130,
        description: "Double shot with velvety steamed milk.",
        sizes: ["8oz"],
        image: "images/flat-white.jpg"
      },
      {
        name: "Kapeng Barako",
        category: "Coffee",
        price: 90,
        description: "Strong local barako, served black or with milk.",
        sizes: ["12oz"],
        image: "images/kapeng-barako.jpg"
      },
      {
        name: "Butter Croissant",
        category: "Pastries",
        price: 85,
        description: "Flaky, golden and baked fresh every morning.",
        sizes: ["1 pc"],
        image: "images/croissant.jpg"
      },
      {
        name: "Cinnamon Roll",
        category: "Pastries",
        price: 110,
        description: "Soft roll swirled with cinnamon and cream cheese glaze.",
        sizes: ["1 pc"],
        image: "images/cinnamon-roll.jpg"
      },
      {
        name: "Blueberry Muffin",
        category: "Pastries",
        price: 95,
        description: "Moist muffin packed with blueberries.",
        sizes: ["1 pc"],
        image: "images/blueberry-muffin.jpg"
      },
      {
        name: "Matcha Latte",
        category: "Non-coffee",
        price: 150,
        description: "Ceremonial matcha whisked with milk.",
        sizes: ["12oz", "16oz"],
        image: "images/matcha-latte.jpg"
      },
      {
        name: "Hot Chocolate",
        category: "Non-coffee",
        price: 120,
        description: "Thick cocoa with steamed milk.",
        sizes: ["12oz", "16oz"],
        image: "images/hot-chocolate.jpg"
      },
      {
        name: "Chai Latte",
        category: "Non-coffee",
        price: 125,
        description: "Spiced black tea with steamed milk.",
        sizes: ["12oz"],
        image: "images/chai-latte.jpg"
      }
    ];

    var categories = ["Coffee", "Pastries", "Non-coffee"];
    var elParent = document.getElementById("parent");

    for (var c = 0; c < categories.length; c++) {
      var cardsHtml = "";

      for (var i = 0; i < menu.length; i++) {
        if (menu[i].category !== categories[c]) {
          continue;
        }

        cardsHtml += `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card menu-card border-0 shadow-sm rounded-4 h-100">
              <div class="menu-image">
                <img src="` + menu[i].image + `" alt="` + menu[i].name + `" onerror="this.style.display='none'">
              </div>
              <div class="card-body d-flex flex-column p-4">
                <div class="h5 mb-3">` + menu[i].name + `</div>
                <div class="mb-3 text-muted small">` + menu[i].description + `</div>
                <div class="d-flex justify-content-between align-items-baseline mt-auto pt-2">
                  <span class="text-secondary small">` + menu[i].sizes.join(", ") + `</span>
                  <span class="price fs-5">₱` + menu[i].price + `</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      elParent.innerHTML += `
        <h2 class="category-title">` + categories[c] + `</h2>
        <div class="row g-4">` + cardsHtml + `</div>
      `;
    }
  </script>
</body>

</html>
